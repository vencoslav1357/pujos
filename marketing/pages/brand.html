<!doctype html>
<meta charset="utf-8" />
<link rel="stylesheet" href="../kit/kit.css" />
<style>
  .canvas { background: #fff; color: var(--navy); font: 400 calc(var(--u) * 1.5)/1.45 Inter; padding: calc(var(--u) * 6) calc(var(--u) * 7); display: grid; grid-template-rows: auto minmax(0, 1fr); gap: calc(var(--u) * 4); }
  header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #e2e8f0; padding-bottom: calc(var(--u) * 3); }
  h2 { font: 600 calc(var(--u) * 1.05)/1 Inter; letter-spacing: .26em; text-transform: uppercase; color: var(--royal); margin: 0 0 calc(var(--u) * 1.6); }
  .meta { text-align: right; color: var(--slate); font-size: calc(var(--u) * 1.3); }
  .meta b { display: block; font: italic 500 calc(var(--u) * 3)/1.1 "Cormorant Garamond"; color: var(--navy); }
  .grid { display: grid; grid-template-columns: 1.15fr 1fr 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; gap: calc(var(--u) * 3); }
  .tile { border-radius: calc(var(--u) * 1.4); display: grid; place-items: center; position: relative; }
  .tile.l { background: #f8fafc; border: 1px solid #e2e8f0; }
  .tile.d { background: radial-gradient(120% 100% at 50% 0%, #1e293b, #0f172a 60%); }
  .cap { position: absolute; left: calc(var(--u) * 1.6); bottom: calc(var(--u) * 1.3); font-size: calc(var(--u) * 1.15); color: var(--slate); }
  .tile.d .cap { color: #94a3b8; }
  .sw { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * 1); width: 100%; height: 100%; }
  .sw div { border-radius: calc(var(--u) * 1); padding: calc(var(--u) * 1.2); display: flex; flex-direction: column; justify-content: flex-end; font-size: calc(var(--u) * 1.15); }
  .sw b { font-weight: 600; font-size: calc(var(--u) * 1.35); }
  .type { padding: calc(var(--u) * 2.8) calc(var(--u) * 2.4); display: flex; flex-direction: column; gap: calc(var(--u) * 1.1); align-items: flex-start; justify-content: center; }
  .icons { display: flex; align-items: flex-end; gap: calc(var(--u) * 2.4); }
  .icons span { display: block; text-align: center; font-size: calc(var(--u) * 1.05); color: var(--slate); margin-top: calc(var(--u) * .8); }
</style>
<body>
<div class="canvas" id="c"></div>
<script type="module">
  // Přehled značky na jeden list (PNG + PDF): podoby loga, barvy, písma, ikony.
  import { setup, ready, loadFonts, mark, wordmark, lockup, badge, html } from "../kit/kit.js";
  const { u } = setup(2400, 1500);
  await loadFonts();
  const swatches = [
    ["Námořní", "#0F172A", "#fff", "písmo loga, text webu"],
    ["Královská", "#2563EB", "#fff", "jiskra, tlačítka"],
    ["Nebeská", "#38A9F8", "#0f172a", "přechod jiskry"],
    ["Ledová", "#BAE0FD", "#0f172a", "plochy, záře"],
    ["Mlha", "#F0F7FF", "#0f172a", "světlé pozadí"],
    ["Břidlice", "#64748B", "#fff", "podtitul, popisky"],
  ];
  document.getElementById("c").innerHTML = html`
    <header>
      ${lockup({ height: 9 * u })}
      <div class="meta"><b>Logo a vizuální styl</b>J. Pufr úklidové služby · podklady pro web</div>
    </header>
    <div class="grid">
      <div class="tile l" style="grid-row:span 2">${lockup({ height: 26 * u, mode: "stacked" })}<div class="cap">Hlavní logo — monogram JP a nápis. Jiskra = lesk po úklidu.</div></div>
      <div class="tile l">${wordmark({ height: 9 * u })}<div class="cap">Nápis — navigace, patička, dokumenty</div></div>
      <div class="tile d">${mark({ size: 16 * u, variant: "light" })}<div class="cap">Značka na tmavém</div></div>
      <div class="tile" style="padding:0"><div class="sw">${swatches.map(([n, hex, fg, use]) => `<div style="background:${hex};color:${fg};${hex === "#F0F7FF" ? "border:1px solid #e2e8f0" : ""}"><b>${n}</b>${hex}<br><span style="opacity:.75">${use}</span></div>`)}</div></div>
      <div class="tile l type">
        <h2>Písmo</h2>
        <div style="font:700 ${3.6 * u}px/1 'Cormorant Garamond';letter-spacing:.04em">Cormorant Garamond</div>
        <div style="font:italic 500 ${2.2 * u}px/1.1 'Cormorant Garamond'">Nadpisy, logo — Bold, kurzíva Medium</div>
        <div style="font:500 ${2.4 * u}px/1 Inter;margin-top:${1 * u}px">Inter</div>
        <div style="font:400 ${1.5 * u}px/1.4 Inter;color:#64748b">Text a popisky. Podtitul loga: Inter Medium, verzálky, prostrkané.</div>
        <div class="icons" style="margin-top:${1.4 * u}px">
          ${[[8, "ikona webu"], [4.27, "64 px"], [2.13, "32 px"], [1.07, "16 px"]].map(([s, l]) => `<div>${badge({ size: s * u })}<span>${l}</span></div>`)}
          <div>${badge({ size: 8 * u, shape: "circle" })}<span>profilovka</span></div>
        </div>
      </div>
    </div>`;
  await ready();
</script>
</body>
